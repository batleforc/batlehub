name: Container image scan
on:
  push:
    branches: ["main"]
    paths:
      - "Containerfile"
      - "Cargo.lock"
      - "ui/pnpm-lock.yaml"
      - ".github/workflows/image-scan.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "Containerfile"
      - "Cargo.lock"
      - "ui/pnpm-lock.yaml"
      - ".github/workflows/image-scan.yaml"
  # Daily rebuild + rescan so a CVE disclosed against a base/OS layer AFTER the
  # last build still trips CI — this is the "future CVE" detection, not just a
  # build-time snapshot.
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Build & Trivy scan (Containerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Containerfile
          load: true
          push: false
          tags: batlehub:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Produce SARIF for the Security tab (does not fail the build).
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: batlehub:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results.sarif
          category: trivy-containerfile
      # The gate: fail the job on any fixable HIGH/CRITICAL OS or library CVE.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: batlehub:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
