name: CodeQL
# Deliberately **unfiltered**: this runs on every push to main and every pull
# request, whatever the diff touches.
#
# It used to carry a `paths:` filter for the source extensions. Two problems with
# that, and the second is the one that bit:
#
#  1. A `paths`-filtered workflow does not run — it does not "pass". If this check
#     is ever made required, a PR that changes no matching file leaves it pending
#     forever, and the usual fix (a dummy always-succeeding job) means the branch
#     protection is satisfied by a job that analysed nothing.
#  2. The filter did not list `.github/codeql/codeql-config.yaml`, so a change to
#     the analysis configuration itself — the file that decides what is scanned
#     and what is excluded — did not trigger an analysis. A scope change could
#     land without a single query being re-run against it.
#
# CodeQL's own alert diffing already handles the "nothing changed" case cheaply,
# and the Rust job's build is cached by `Swatinem/rust-cache`. Paying for a run on
# a docs-only PR is the cheaper mistake.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "50 23 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-rust:
    name: Analyze Rust
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: rust
          config-file: ./.github/codeql/codeql-config.yaml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build Rust workspace
        run: cargo build --locked --workspace
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yaml
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
