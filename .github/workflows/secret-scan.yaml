name: Secret scan
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so PR commits and the existing tree are scanned
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by the gitleaks *binary*, not by the action: v3.0.0's bundle
          # never mentions `GITLEAKS_CONFIG` (its own env vars are
          # `GITLEAKS_{VERSION,LICENSE,ENABLE_*,NOTIFY_USER_LIST}`). It works
          # because the action spawns gitleaks with this environment and the CLI
          # binds the variable itself. Verified against both versions below —
          # do not "clean this up" into an action input that does not exist.
          GITLEAKS_CONFIG: ${{ github.workspace }}/gitleaks.toml
          # Pinned, and pinned to the same version `mise.toml` installs, so
          # `task security` locally and this gate run the identical ruleset.
          #
          # They did not. The action defaults to 8.24.3 while mise resolved
          # `latest` to 8.30.1, and 8.24.3's `generic-api-key` rule matched a
          # test fixture that 8.30.1's does not — so the gate failed on a
          # finding no contributor could reproduce, and `task security` said the
          # tree was clean.
          GITLEAKS_VERSION: "8.30.1"
          # GitHub *organisation* accounts need a (free) license key here:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
