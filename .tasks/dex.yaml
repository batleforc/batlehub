version: "3"

# kubectl hops into the dex sidecar of this workspace pod.
vars:
  DEX_EXEC: kubectl exec ${DEVWORKSPACE_NAMESPACE:+-n ${DEVWORKSPACE_NAMESPACE}} ${HOSTNAME} -c dex --
  DEX_LOGS: kubectl logs ${DEVWORKSPACE_NAMESPACE:+-n ${DEVWORKSPACE_NAMESPACE}} ${HOSTNAME} -c dex

tasks:
  # The sidecar is declared in devfile.yaml and listens on 9000, the port the
  # compose Authentik uses — so `localhost:9000` is the local IdP either way and
  # only `issuer_url` tells them apart. Everything here is about one value: the
  # issuer. It has to be a single URL that the browser is redirected to, that the
  # backend fetches `/.well-known/openid-configuration` from, and that comes back
  # as the `iss` this server then checks — and in a workspace that URL contains
  # the workspace name, so it cannot be committed. Hence a rendered config.

  dex:config:
    desc: "Render dev/dex/config.yaml and the matching [[auth]] block for this workspace (LOCAL=1 for an issuer only the pod can reach)"
    cmds:
      - |
        set -eu
        if [ -n "{{.LOCAL}}" ]; then
          # Reachable from the backend and the che-browser sidecar (one pod, one
          # network namespace), not from your own browser. `is_secure_issuer_url`
          # lets plain HTTP through for loopback exactly so this works.
          issuer="http://localhost:9000"
          back="http://localhost:8080"
          front="http://localhost:5173"
        else
          # `url` prints a trailing slash; the issuer must not have one, or the
          # `iss` dex mints and the `issuer_url` in the config stop matching.
          issuer="$(url dex | sed 's#/$##')"
          back="$(url back | sed 's#/$##')"
          front="$(url front | sed 's#/$##')"
        fi
        # The dev password's bcrypt hash, computed here rather than committed.
        #
        # A `$2b$10$…` literal in a tracked file is an ERROR-severity finding for
        # semgrep's `p/secrets` ruleset and for gitleaks, both of which gate every
        # pull request — and neither can tell this fixture from a live credential,
        # which is the correct behaviour for a secret scanner. Rendering it keeps
        # the template clean without an allowlist entry that has to stay accurate
        # for the rest of the repository's life.
        #
        # `DEX_PASSWORD_HASH` first, so a developer with no hasher to hand can
        # still render; `DEX_PASSWORD` otherwise, defaulting to the "password"
        # the template documents.
        dex_password="${DEX_PASSWORD:-password}"
        if [ -n "${DEX_PASSWORD_HASH:-}" ]; then
          dex_hash="$DEX_PASSWORD_HASH"
        elif command -v htpasswd >/dev/null 2>&1; then
          # The form the template's own comment has always named.
          dex_hash="$(htpasswd -bnBC 10 "" "$dex_password" | tr -d ':\n')"
        elif command -v uv >/dev/null 2>&1; then
          # `uv` is provisioned by mise.toml, and `--with` keeps bcrypt out of
          # the workspace's own environment. The password travels in the
          # environment rather than in argv: it is a password, and argv is world
          # readable on Linux.
          dex_hash="$(DEX_PW="$dex_password" uv run --quiet --with bcrypt python -c \
            'import bcrypt, os; print(bcrypt.hashpw(os.environ["DEX_PW"].encode(), bcrypt.gensalt(10, prefix=b"2b")).decode())')"
        elif python3 -c 'import bcrypt' >/dev/null 2>&1; then
          dex_hash="$(DEX_PW="$dex_password" python3 -c \
            'import bcrypt, os; print(bcrypt.hashpw(os.environ["DEX_PW"].encode(), bcrypt.gensalt(10, prefix=b"2b")).decode())')"
        else
          echo "dex:config: no bcrypt hasher found." >&2
          echo "  Install one of: htpasswd (apache2-utils), uv (mise install), python3 + bcrypt." >&2
          echo "  Or pass a hash you already have: DEX_PASSWORD_HASH='\$2b\$10\$…' task dex:config" >&2
          exit 1
        fi
        case "$dex_hash" in
          # dex accepts the 2a/2b/2y bcrypt prefixes and nothing else, and a
          # silently wrong hash here is a login that fails with "invalid
          # password" and no other clue.
          '$2a$'*|'$2b$'*|'$2y$'*) ;;
          *) echo "dex:config: '$dex_hash' is not a bcrypt hash" >&2; exit 1 ;;
        esac
        # One callback for every provider: BatleHub has a single callback route
        # and resolves the provider from the stored login state, so a
        # per-provider path would be a 404 after a successful password.
        #
        # `#` as the sed delimiter throughout: a bcrypt hash contains `/` and
        # `$`, and the URLs contain `/`.
        #
        # Rendered beside the target and moved into place, never written through:
        # the sidecar's supervisor hashes this file every two seconds to decide
        # whether to restart dex, and a redirection that truncates first leaves a
        # window in which what it hashes — and would then hand to dex — is half a
        # config. `mv` within the directory is a rename, so the file is either the
        # old one or the new one.
        sed -e "s#__ISSUER__#$issuer#g" \
            -e "s#__CALLBACK__#$back/api/v1/auth/oidc/callback#g" \
            -e "s#__PASSWORD_HASH__#$dex_hash#g" \
            dev/dex/config.tmpl.yaml > dev/dex/config.yaml.tmp
        mv dev/dex/config.yaml.tmp dev/dex/config.yaml
        cat > dev/dex/auth.toml <<EOF
        # Generated by \`task dex:config\`. Replace the two [[auth]] type = "oidc"
        # blocks in your server config with these, then restart the server.
        #
        # Not needed for \`task run:space\`: config.example-space.toml already
        # describes this provider and reads the same three URLs out of the
        # environment. This file is for a config of your own.
        #
        # role_claim is "email", not "groups": dex's password DB carries no group
        # membership, so a groups claim would never arrive and every login would
        # map to Role::Anonymous.
        [[auth]]
        type = "oidc"
        issuer_url = "$issuer"
        client_id = "proxy-auth"
        client_secret = "\${OIDC_CLIENT_SECRET}"   # export OIDC_CLIENT_SECRET=proxy-auth-secret
        redirect_uri = "$back/api/v1/auth/oidc/callback"
        scopes = ["openid", "profile", "email"]
        frontend_url = "$front"
        user_id_claim = "email"
        role_claim = "email"

        [auth.role_mappings]
        "admin@example.com" = "admin"
        "dev@example.com" = "user"

        # Same redirect_uri as the block above, deliberately: one callback route
        # serves every provider, and the provider is read from the login state
        # rather than the path. Reach this one with
        # /api/v1/auth/oidc/login?provider=oidc2.
        [[auth]]
        name = "oidc2"
        type = "oidc"
        issuer_url = "$issuer"
        client_id = "proxy-auth"
        client_secret = "\${OIDC2_CLIENT_SECRET}"  # export OIDC2_CLIENT_SECRET=proxy-auth-secret
        redirect_uri = "$back/api/v1/auth/oidc/callback"
        scopes = ["openid", "profile", "email"]
        frontend_url = "$front"
        user_id_claim = "email"
        role_claim = "email"

        [auth.role_mappings]
        "admin@example.com" = "admin"
        "dev@example.com" = "user"

        # And so the SPA on $front may call the API at all — absent means
        # same-origin only, which is every request failing with a 400.
        # [server]
        # cors_allowed_origins = ["$front"]
        EOF
        echo "dev/dex/config.yaml   issuer $issuer"
        echo "dev/dex/auth.toml     the [[auth]] blocks to paste into your server config"
        echo
      # Writing the file used to be half the job: dex reads it once, at boot, so
      # a config rendered while dex was already running did nothing until the
      # whole workspace was restarted. It isn't half the job any more — and it
      # is not conditional on remembering a second command either.
      - task: dex:reload

  dex:reload:
    desc: "Have the dex sidecar re-read dev/dex/config.yaml — seconds, and without restarting anything else"
    cmds:
      - |
        set -eu

        # Dex has no reload. `dex serve` parses the file once at startup and
        # offers neither a SIGHUP path nor a validate flag (`dex serve --help`
        # lists only the four address overrides), and the config is a file on
        # disk rather than a row in its storage — so the only way to change it is
        # to run the process again.
        #
        # What this task must NOT do is end the container to get that. Killing
        # PID 1 in a sidecar does not restart the sidecar here: the pod is
        # replaced and every container in it goes down together — a workspace
        # restart, arrived at the long way round. So dex is no longer PID 1. The
        # supervisor in devfile.yaml holds that slot and watches two files on the
        # shared volume; this task writes one of them and waits on the other.
        # Nothing is killed from this side, and nothing here can take the pod
        # down even if it is wrong.
        cfg=dev/dex/config.yaml
        reload=dev/dex/reload
        state=dev/dex/state
        if [ ! -f "$cfg" ]; then
          echo "dex:reload: no $cfg — run 'task dex:config' first" >&2
          exit 1
        fi

        # ── Pre-flight ────────────────────────────────────────────────────────
        # A config that does not parse makes dex exit at once, and the supervisor
        # will then hold rather than restart it — no crash loop, but no IdP
        # either until the file is fixed. Cheaper to find out before the running
        # instance is asked to give up its place.
        #
        # The candidate is booted by the same binary that will have to live with
        # it, in the same container. `storage.type` is `memory`
        # (dev/dex/config.tmpl.yaml), so the second instance shares nothing with
        # the first, and all three addresses are overridden because the real dex
        # still holds 9000 — a candidate that tried to bind it would fail for a
        # reason that has nothing to do with its own correctness.
        #
        # The exit code cannot be the verdict: a *valid* config runs until
        # `timeout` terminates it, which is also an exit 2. What separates them is
        # how far it got — `server=http` is logged only after parsing, validation
        # and the bind all succeeded.
        #
        # kubectl is the only thing here that needs it, and it is a check, not the
        # mechanism: without it the reload still works, it just goes in unverified.
        if command -v kubectl >/dev/null 2>&1 && [ -n "${HOSTNAME:-}" ]; then
          echo "dex:reload: checking $cfg with dex itself…"
          # Two redirections, and both are load-bearing. The inner one folds dex's
          # own stderr into the stream `$(…)` captures, inside the container. The
          # outer one does the same for kubectl's, which otherwise prints
          # "command terminated with exit code 2" straight to the terminal — on
          # the *success* path, since terminating a healthy candidate is exactly
          # what `timeout` is there to do. Captured, it is silent when the check
          # passes and still part of the `tail -5` below when it does not.
          out=$({{.DEX_EXEC}} /bin/sh -c \
            'timeout 5 /usr/local/bin/dex serve /projects/proxy-cache/dev/dex/config.yaml \
               --web-http-addr 127.0.0.1:19000 \
               --telemetry-addr 127.0.0.1:19001 \
               --grpc-addr 127.0.0.1:19002 2>&1' 2>&1 || true)
          if ! printf '%s' "$out" | grep -q 'server=http'; then
            echo "dex:reload: $cfg is not one dex can serve — the running instance is untouched." >&2
            echo "$out" | tail -5 >&2
            exit 1
          fi
        else
          echo "dex:reload: no kubectl — skipping the pre-flight check." >&2
        fi

        # ── Ask ───────────────────────────────────────────────────────────────
        # Nanoseconds and the shell's PID, so that two reloads in the same second
        # are still two distinct values. The supervisor stamps this file together
        # with the config, so a reload lands whether or not the config changed —
        # which is the case `task dex:config` cannot cover on its own (a new
        # client secret in the template renders to the same bytes for an
        # unchanged issuer).
        before="$(cat "$state" 2>/dev/null || true)"
        printf '%s %s\n' "$(date +%s%N)" "$$" > "$reload"

        # ── Wait for the ack ──────────────────────────────────────────────────
        # The supervisor rewrites `state` each time it starts dex, so a changed
        # value is proof the restart happened. Polling the discovery endpoint
        # alone could not tell that apart from the *old* dex still answering on
        # 9000 with the config you just replaced — the failure mode that looks
        # like success.
        acked=""
        for _ in $(seq 1 20); do
          if [ "$(cat "$state" 2>/dev/null || true)" != "$before" ]; then acked=1; break; fi
          sleep 1
        done

        if [ -z "$acked" ]; then
          # No supervisor watching. Almost always one thing: this pod predates the
          # devfile change, so its dex container is still the boot-once one. The
          # config on disk is correct and complete — it is only not live.
          echo "dex:reload: the sidecar is not watching for config changes." >&2
          echo "  This pod's dex container was started before the supervisor was added" >&2
          echo "  to devfile.yaml. Restart the workspace once to adopt it; after that," >&2
          echo "  'task dex:config' and 'task dex:reload' take effect in seconds." >&2
          echo "  dev/dex/config.yaml is written either way — dex is still serving the old one." >&2
          exit 0
        fi

        # Ask over loopback, for the reason dex:check gives: this is asking
        # whether the process is *up*, and going out through the gateway would
        # confuse a down sidecar with a down ingress.
        for _ in $(seq 1 60); do
          if curl -sf -m 2 http://localhost:9000/.well-known/openid-configuration >/dev/null 2>&1; then
            curl -sf http://localhost:9000/.well-known/openid-configuration \
              | python3 -c 'import json,sys; print("dex:reload: serving issuer", json.load(sys.stdin)["issuer"])'
            exit 0
          fi
          sleep 1
        done

        # It restarted and did not come back. The config is left exactly as
        # written — rolling it back would throw away an edit that may well be
        # right — and the supervisor is holding, so nothing is looping. Its own
        # logs say why.
        echo "dex:reload: dex restarted but did not answer within 60s. Its own logs:" >&2
        {{.DEX_LOGS}} --tail=20 >&2 || true
        exit 1

  dex:check:
    desc: Fetch dex's discovery document — proves the sidecar is up and says which issuer it is serving
    cmds:
      - |
        set -eu
        # Always over loopback: this asks whether dex is *running*, and going out
        # to the gateway to answer that would confuse a down sidecar with a down
        # ingress. The issuer inside the document is the public one either way.
        curl -sf http://localhost:9000/.well-known/openid-configuration \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); print("issuer:  ", d["issuer"]); print("authz:   ", d["authorization_endpoint"]); print("jwks:    ", d["jwks_uri"])'

  dex:logs:
    desc: Tail the dex sidecar's logs
    cmds:
      - '{{.DEX_LOGS}} {{.CLI_ARGS}}'

  dex:token:
    desc: "Mint a JWT without a browser, for curl (task dex:token -- admin@example.com password)"
    cmds:
      - |
        set -eu
        # The password grant, which dex serves for a client that asks for it. The
        # browser flow is what SSO uses; this is for probing the API by hand.
        args="{{.CLI_ARGS}}"
        case "$args" in
          *\ *) ;;
          *) echo "usage: task dex:token -- <email> <password>" >&2; exit 1 ;;
        esac
        user="${args%% *}"; pass="${args##* }"
        curl -sf http://localhost:9000/token \
          -d grant_type=password -d scope="openid email profile" \
          -d client_id=proxy-auth -d client_secret=proxy-auth-secret \
          -d "username=$user" -d "password=$pass" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["id_token"])'

