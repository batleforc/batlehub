schemaVersion: 2.3.0
metadata:
  name: batlehub
parent:
  uri: https://raw.githubusercontent.com/batleforc/WeeboDevImage/refs/heads/main/che-min-mise/devfile.yaml
  components:
    - name: tools
      container:
        memoryLimit: 15Gi
        endpoints:
        - name: front
          targetPort: 5173
          exposure: public
          protocol: https
          secure: true
        - name: back
          targetPort: 8080
          exposure: public
          protocol: https
          secure: true

components:
  # Headed Chrome (Chrome for Testing) behind Xvfb, in a sidecar of this pod.
  # Every container in the pod shares one network namespace, so CDP and
  # chromedriver are plain `localhost` ports from the tools container — and the
  # dev server on 5173 is reachable from Chrome the same way, with no ingress.
  #
  # It exists for the checks that only a rendered page can answer: RFC 0003
  # Phase 9's detector pass at two viewports and the axe scan. Reading source
  # cannot measure contrast on painted pixels, focus-ring visibility, or reflow
  # at 390px. Chromium in the tools container cannot run (the image has no
  # libglib and there is no root), which is precisely the gap this fills.
  #
  # Upstream: github.com/batleforc/WeeboDevImage/tree/main/che-browser
  - name: browser
    container:
      image: ghcr.io/batleforc/weebodevimage/che-browser:main
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      # Shared so Chrome can open file:///projects/… and so screenshots and
      # reports can be exchanged with the tools container through /projects.
      mountSources: true
      endpoints:
        # Watch or drive the same Chrome the automation drives. The password is
        # in /projects/.sidecar/vnc-password-browser.txt — `task browser:vnc`.
        - name: novnc
          targetPort: 6080
          exposure: public
          protocol: https
          secure: true
        # DevTools Protocol. Internal on purpose: anything that can reach it can
        # drive the browser, and it needs no exposure to be useful from the pod.
        - name: cdp
          targetPort: 9222
          exposure: internal
          protocol: http
        - name: webdriver
          targetPort: 9515
          exposure: internal
          protocol: http
  # Dex — an OIDC provider for the [[auth]] stack, on the same port 9000 the
  # compose Authentik uses. Authentik is four containers and a Postgres of its
  # own: a compose stack, not something a workspace can carry. Dex is one
  # container with in-memory storage, so it fits here and starts with the pod.
  #
  # It listens on 9000 for the backend and the che-browser sidecar (one pod, one
  # network namespace), and is published through the gateway so browser SSO
  # works from a real browser too. The endpoint is deliberately NOT `secure`:
  # the backend fetches the discovery document unauthenticated, and Che's auth
  # in front of it would answer that fetch with a login page. What is exposed is
  # a throwaway IdP holding two accounts whose password is "password" — do not
  # add anything to it you would mind a passer-by reaching, and use
  # `task dex:config LOCAL=1` plus `exposure: internal` if you want it sealed
  # inside the pod.
  #
  # The config is rendered, not committed — the issuer is this workspace's FQDN.
  # `task dex:config` writes it; until then the container sits in the wait loop
  # below rather than crash-looping, which would leave the pod short of Ready
  # and the workspace unable to start.
  - name: dex
    container:
      image: ghcr.io/dexidp/dex:v2.45.0
      memoryLimit: 256Mi
      memoryRequest: 64Mi
      cpuLimit: "500m"
      cpuRequest: 50m
      # For dev/dex/config.yaml, which `task dex:config` writes from the tools
      # container into the shared /projects volume.
      mountSources: true
      command: ["/bin/sh", "-c"]
      args:
        - |
          cfg="${PROJECTS_ROOT:-/projects}/proxy-cache/dev/dex/config.yaml"
          while [ ! -f "$cfg" ]; do
            echo "dex: waiting for $cfg — run 'task dex:config' in the tools container"
            sleep 5
          done
          echo "dex: starting with $cfg"
          exec /usr/local/bin/dex serve "$cfg"
      endpoints:
        - name: dex
          targetPort: 9000
          exposure: public
          protocol: https
          secure: false
  - name: postgres
    container:
      image: postgres:17-alpine
      env:
        - name: POSTGRES_DB
          value: batlehub
        - name: POSTGRES_PASSWORD
          value: changeme
        - name: POSTGRES_USER
          value: batlehub
        - name: PGDATA
          value: /data/pgdata
      endpoints:
        - name: port-5432
          targetPort: 5432
          exposure: public
      volumeMounts:
        - name: postgres-data
          path: /data/
      mountSources: true
  - name: postgres-data
    volume:
      size: 10Gi
