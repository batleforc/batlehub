      - until podman exec {{.PG_CONTAINER}} pg_isready -U postgres; do sleep 1; done
      - cargo test -p batlehub-adapters --test pg_stats_history -- --nocapture

  test:pg-me-scoping:
    desc: Run the /api/v1/me scoping integration tests (starts a temporary Postgres container via Podman)
    vars:
      PG_CONTAINER: batlehub-test-pg-me
      PG_PORT: "15435"
      PG_PASSWORD: testpass
      CONF_OVERRIDE: /tmp/batlehub-containers.conf
    env:
      CONTAINERS_CONF_OVERRIDE: "{{.CONF_OVERRIDE}}"
      DATABASE_URL: "postgresql://postgres:{{.PG_PASSWORD}}@127.0.0.1:{{.PG_PORT}}/postgres"
    cmds:
      - printf '[network]\ndefault_rootless_network_cmd = "pasta"\n' > {{.CONF_OVERRIDE}}
      - defer: podman rm -f {{.PG_CONTAINER}} 2>/dev/null || true
      - podman run -d --name {{.PG_CONTAINER}} -p {{.PG_PORT}}:5432 -e POSTGRES_PASSWORD={{.PG_PASSWORD}} postgres:17-alpine
      - until podman exec {{.PG_CONTAINER}} pg_isready -U postgres; do sleep 1; done
      - cargo test -p batlehub-adapters --test pg_me_scoping -- --nocapture

  test:pg-explore:
    desc: Run explore per-package visibility integration tests (starts a temporary Postgres container via Podman)
    vars:
      PG_CONTAINER: batlehub-test-pg-explore
      PG_PORT: "15434"
      PG_PASSWORD: testpass
      CONF_OVERRIDE: /tmp/batlehub-containers.conf
    env:
      CONTAINERS_CONF_OVERRIDE: "{{.CONF_OVERRIDE}}"
      DATABASE_URL: "postgresql://postgres:{{.PG_PASSWORD}}@127.0.0.1:{{.PG_PORT}}/postgres"
    cmds:
      - printf '[network]\ndefault_rootless_network_cmd = "pasta"\n' > {{.CONF_OVERRIDE}}
      - defer: podman rm -f {{.PG_CONTAINER}} 2>/dev/null || true
      - podman run -d --name {{.PG_CONTAINER}} -p {{.PG_PORT}}:5432 -e POSTGRES_PASSWORD={{.PG_PASSWORD}} postgres:17-alpine
      # Bounded, and probing TCP rather than the Unix socket. Two failure modes
      # this avoids, both of which an unbounded `until … pg_isready` walks into:
      # a container that never starts (bad image pull, port already bound) hangs
      # the task forever with no output; and the postgres image runs a temporary
      # server on the *socket only* during initdb, so a socket probe can report
      # ready just before the real server restarts, handing the test a refused
      # connection. `-h 127.0.0.1` forces the TCP listener, which only the final
      # server binds.
      - |
        for _ in $(seq 1 60); do
          if podman exec {{.PG_CONTAINER}} pg_isready -U postgres -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "postgres did not become ready within 60s" >&2
        podman logs {{.PG_CONTAINER}} >&2 || true
        exit 1
      - cargo test -p batlehub-adapters --test pg_explore_visibility -- --nocapture

  test:pg-local-registry:
    desc: Run PostgresLocalRegistry integration tests (starts a temporary Postgres container via Podman)
    vars:
      PG_CONTAINER: batlehub-test-pg-local
      PG_PORT: "15433"
      PG_PASSWORD: testpass
      CONF_OVERRIDE: /tmp/batlehub-containers.conf
    env:
      CONTAINERS_CONF_OVERRIDE: "{{.CONF_OVERRIDE}}"
      DATABASE_URL: "postgresql://postgres:{{.PG_PASSWORD}}@127.0.0.1:{{.PG_PORT}}/postgres"
    cmds:
      - printf '[network]\ndefault_rootless_network_cmd = "pasta"\n' > {{.CONF_OVERRIDE}}
      - defer: podman rm -f {{.PG_CONTAINER}} 2>/dev/null || true
      - podman run -d --name {{.PG_CONTAINER}} -p {{.PG_PORT}}:5432 -e POSTGRES_PASSWORD={{.PG_PASSWORD}} postgres:17-alpine
      - until podman exec {{.PG_CONTAINER}} pg_isready -U postgres; do sleep 1; done
      - cargo test -p batlehub-adapters --test local_registry -- --nocapture

  test:pg-storage-router:
    desc: Run storage_router integration tests (starts a temporary Postgres container via Podman)
    vars:
      PG_CONTAINER: batlehub-test-pg
      PG_PORT: "15432"
      PG_PASSWORD: testpass
      CONF_OVERRIDE: /tmp/batlehub-containers.conf
    env:
      CONTAINERS_CONF_OVERRIDE: "{{.CONF_OVERRIDE}}"
      DATABASE_URL: "postgresql://postgres:{{.PG_PASSWORD}}@127.0.0.1:{{.PG_PORT}}/postgres"
    cmds:
      - printf '[network]\ndefault_rootless_network_cmd = "pasta"\n' > {{.CONF_OVERRIDE}}
      - defer: podman rm -f {{.PG_CONTAINER}} 2>/dev/null || true
      - podman run -d --name {{.PG_CONTAINER}} -p {{.PG_PORT}}:5432 -e POSTGRES_PASSWORD={{.PG_PASSWORD}} postgres:17-alpine
      - until podman exec {{.PG_CONTAINER}} pg_isready -U postgres; do sleep 1; done
      - cargo test -p batlehub-adapters --test storage_router -- --nocapture

  test:pg-artifact-meta:
    desc: Run artifact_meta integration tests (starts a temporary Postgres container via Podman)
    vars:
      PG_CONTAINER: batlehub-test-pg
      PG_PORT: "15432"
      PG_PASSWORD: testpass
      CONF_OVERRIDE: /tmp/batlehub-containers.conf
    env:
      CONTAINERS_CONF_OVERRIDE: "{{.CONF_OVERRIDE}}"
      DATABASE_URL: "postgresql://postgres:{{.PG_PASSWORD}}@127.0.0.1:{{.PG_PORT}}/postgres"
    cmds:
      - printf '[network]\ndefault_rootless_network_cmd = "pasta"\n' > {{.CONF_OVERRIDE}}
      - defer: podman rm -f {{.PG_CONTAINER}} 2>/dev/null || true
      - podman run -d --name {{.PG_CONTAINER}} -p {{.PG_PORT}}:5432 -e POSTGRES_PASSWORD={{.PG_PASSWORD}} postgres:17-alpine
      - until podman exec {{.PG_CONTAINER}} pg_isready -U postgres; do sleep 1; done
      - cargo test -p batlehub-adapters --test artifact_meta -- --nocapture

  test:s3:
    desc: Run S3 storage integration tests (starts a temporary MinIO container via Podman)
    vars:
      MINIO_CONTAINER: batlehub-test-minio
      MINIO_PORT: "19000"
      CONF_OVERRIDE: /tmp/batlehub-containers.conf
    env:
      CONTAINERS_CONF_OVERRIDE: "{{.CONF_OVERRIDE}}"
      S3_TEST_ENDPOINT: "http://127.0.0.1:{{.MINIO_PORT}}"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    cmds:
      - printf '[network]\ndefault_rootless_network_cmd = "pasta"\n' > {{.CONF_OVERRIDE}}
      - defer: podman rm -f {{.MINIO_CONTAINER}} 2>/dev/null || true
      - podman run -d --name {{.MINIO_CONTAINER}} -p {{.MINIO_PORT}}:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
      - until curl -sf http://127.0.0.1:{{.MINIO_PORT}}/minio/health/live; do sleep 1; done
      - cargo test -p batlehub-adapters --features storage-s3 --test s3_storage -- --nocapture

  test:repo-interop:
    desc: Verify real apt + dnf + pacman accept BatleHub's signed Deb/RPM/pacman repos (needs podman or docker)
    cmds:
      - bash tests/interop/verify.sh

  test:real-proxy:
    desc: "Layer 4 smoke tests through a real proxy to real upstreams (needs mise + network; ~30 min)"
    env:
      # Turns every unmet prerequisite into a failure instead of a printed skip.
      # Without it these tests return early when a toolchain or the network is
      # missing, and libtest counts that as a pass — a suite of 17 could report
      # "17 passed" having reached no upstream at all. A run that asks for them
      # is asserting the prerequisites exist, so say so.
      REAL_PROXY_REQUIRE: "1"
    cmds:
      # `--ignored` rather than `--include-ignored`: this file is entirely
      # ignored-by-default scenarios, and there is nothing else in the binary to
      # run alongside them.
      - cargo test -p batlehub-examples --test real_proxy -- --ignored --nocapture {{.CLI_ARGS}}

  test:marketplace-heavy:
    desc: "Heavy marketplace integration: install weebo-bridge-notify into headless VS Code + IntelliJ from a local BatleHub instance (needs DATABASE_URL; downloads the IDEs on first run)"
    cmds:
      - bash tests/heavy/marketplace.sh

  test:bundler-heavy:
    desc: "Heavy Bundler integration: `bundle install` against a local rubygems registry, asserting the compact index's 206/304 answers are ones Bundler accepts (needs DATABASE_URL; installs bundler on first run)"
    cmds:
      - bash tests/heavy/bundler.sh

  test:npm-heavy:
    desc: "Heavy npm integration: publish/install/whoami/ping/dist-tags/search against a local registry, and `npm audit` on the path npm really sends (needs DATABASE_URL + network)"
    cmds:
      - bash tests/heavy/npm.sh

  test:pypi-heavy:
    desc: "Heavy PyPI integration: `twine upload` then `pip install`, and the PEP 658 `.metadata` sibling pip refuses to do without (needs DATABASE_URL + network)"
    cmds:
      - bash tests/heavy/pypi.sh

  test:openvsx-heavy:
    desc: "Heavy Open VSX integration: `ovsx publish` (token in a query parameter) and `ovsx get` following the rewritten download URL (needs DATABASE_URL + network)"
    cmds:
      - bash tests/heavy/openvsx.sh

  test:conda-heavy:
    desc: "Heavy conda integration: micromamba's `HEAD` probe for repodata.json.zst, and a package published after the compressed channel was warmed (needs DATABASE_URL; downloads micromamba on first run)"
    cmds:
      - bash tests/heavy/conda.sh

  test:nuget-heavy:
    desc: "Heavy NuGet integration: `dotnet nuget push`, `dotnet package search` (service discovery + skip pagination) and `dotnet add package` (needs DATABASE_URL + the .NET SDK)"
    cmds:
      - bash tests/heavy/nuget.sh

  test:composer-heavy:
    desc: "Heavy Composer integration: resolve from local and proxy repositories with Packagist disabled, and reach search.json through the advertised URL template (needs DATABASE_URL + network)"
    cmds:
      - bash tests/heavy/composer.sh

  test:terraform-heavy:
    desc: "Heavy Terraform integration: `terraform init` over TLS through host-routed discovery — versions, download document, shasums, signature and archive all through the proxy (needs DATABASE_URL + network)"
    cmds:
      - bash tests/heavy/terraform.sh

  test:heavy:
    desc: "Every heavy client suite except the marketplaces (which download two IDEs). Sequential: each one binds its own ports but they all share one Postgres."
    cmds:
      - bash tests/heavy/bundler.sh
      - bash tests/heavy/npm.sh
      - bash tests/heavy/pypi.sh
      - bash tests/heavy/openvsx.sh
      - bash tests/heavy/conda.sh
      - bash tests/heavy/nuget.sh
      - bash tests/heavy/composer.sh
      - bash tests/heavy/terraform.sh

  coverage:
    desc: Generate an HTML coverage report and an lcov report for SonarQube — starts Postgres, MinIO and Redis to include all integration tests
    vars:
      PG_CONTAINER: batlehub-cov-pg
      PG_PORT: "25432"
      PG_PASSWORD: covpass
      MINIO_CONTAINER: batlehub-cov-minio
      MINIO_PORT: "29000"
      REDIS_CONTAINER: batlehub-cov-redis
      REDIS_PORT: "26379"
      CONF_OVERRIDE: /tmp/batlehub-cov-containers.conf
      COVERAGE_EXCLUDE: "server/src/(main|server_factory|setup|stores|watcher)\\.rs|crates/web/src/handlers/auth/oidc(\\.rs|/)|crates/web/src/handlers/back_office/health/system\\.rs|crates/adapters/src/db/|crates/adapters/src/registry/(cargo|npm)\\.rs|crates/adapters/src/registry/github/|crates/adapters/src/notification/postgres\\.rs|crates/adapters/src/sbom/fetcher\\.rs|crates/adapters/src/cache/(postgres|banner_redis)\\.rs|crates/adapters/src/local_registry/postgres\\.rs|crates/adapters/src/rate_limit/(postgres|ip_block_postgres)\\.rs|crates/adapters/src/storage/router/|cli/src/tui/|cli/src/(api|cli)/owner\\.rs"
    env:
      CONTAINERS_CONF_OVERRIDE: "{{.CONF_OVERRIDE}}"
      DATABASE_URL: "postgresql://postgres:{{.PG_PASSWORD}}@127.0.0.1:{{.PG_PORT}}/postgres"
      S3_TEST_ENDPOINT: "http://127.0.0.1:{{.MINIO_PORT}}"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      REDIS_URL: "redis://127.0.0.1:{{.REDIS_PORT}}"
    cmds:
      - printf '[network]\ndefault_rootless_network_cmd = "pasta"\n' > {{.CONF_OVERRIDE}}
      - defer: podman rm -f {{.PG_CONTAINER}} {{.MINIO_CONTAINER}} {{.REDIS_CONTAINER}} 2>/dev/null || true
      - podman run -d --user postgres --name {{.PG_CONTAINER}} -p {{.PG_PORT}}:5432 -e POSTGRES_PASSWORD={{.PG_PASSWORD}} postgres:17-alpine
      - podman run -d --name {{.MINIO_CONTAINER}} -p {{.MINIO_PORT}}:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
      - podman run -d --name {{.REDIS_CONTAINER}} -p {{.REDIS_PORT}}:6379 redis:7-alpine redis-server --save "" --appendonly no
      - until podman exec {{.PG_CONTAINER}} pg_isready -U postgres; do sleep 1; done
      - until curl -sf http://127.0.0.1:{{.MINIO_PORT}}/minio/health/live; do sleep 1; done
      - until podman exec {{.REDIS_CONTAINER}} redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done
      - cargo llvm-cov clean --workspace
      - cargo llvm-cov --no-report --workspace --ignore-filename-regex "{{.COVERAGE_EXCLUDE}}"
      - cargo llvm-cov --no-report -p batlehub-adapters --test pg_cache
      - cargo llvm-cov --no-report -p batlehub-adapters --test pg_vulnerability
      - cargo llvm-cov --no-report -p batlehub-adapters --test local_registry
      - cargo llvm-cov --no-report -p batlehub-adapters --test artifact_meta
      - cargo llvm-cov --no-report -p batlehub-adapters --test pg_rate_limit
      - cargo llvm-cov --no-report -p batlehub-adapters --test storage_router
      - cargo llvm-cov --no-report -p batlehub-adapters --features storage-s3 --test s3_storage
      - cargo llvm-cov --no-report -p batlehub-adapters --test actions_oidc
      - cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_cache
      - cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_rate_limit
      - cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_warm_coordinator
      - cargo llvm-cov report --html --output-dir coverage/html --ignore-filename-regex "{{.COVERAGE_EXCLUDE}}"
      - cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "{{.COVERAGE_EXCLUDE}}"

  coverage-check:
    desc: Fail if line coverage is below 80% — starts Postgres, MinIO and Redis to include all integration tests
    vars:
      PG_CONTAINER: batlehub-cov-pg
      PG_PORT: "25432"
      PG_PASSWORD: covpass
      MINIO_CONTAINER: batlehub-cov-minio
      MINIO_PORT: "29000"
      REDIS_CONTAINER: batlehub-cov-redis
      REDIS_PORT: "26379"
      CONF_OVERRIDE: /tmp/batlehub-cov-containers.conf
      COVERAGE_EXCLUDE: "server/src/(main|server_factory|setup|stores|watcher)\\.rs|crates/web/src/handlers/auth/oidc(\\.rs|/)|crates/web/src/handlers/back_office/health/system\\.rs|crates/adapters/src/db/|crates/adapters/src/registry/(cargo|npm)\\.rs|crates/adapters/src/registry/github/|crates/adapters/src/notification/postgres\\.rs|crates/adapters/src/sbom/fetcher\\.rs|crates/adapters/src/cache/(postgres|banner_redis)\\.rs|crates/adapters/src/local_registry/postgres\\.rs|crates/adapters/src/rate_limit/(postgres|ip_block_postgres)\\.rs|crates/adapters/src/storage/router/|cli/src/tui/|cli/src/(api|cli)/owner\\.rs"
    env:
      CONTAINERS_CONF_OVERRIDE: "{{.CONF_OVERRIDE}}"
      DATABASE_URL: "postgresql://postgres:{{.PG_PASSWORD}}@127.0.0.1:{{.PG_PORT}}/postgres"
      S3_TEST_ENDPOINT: "http://127.0.0.1:{{.MINIO_PORT}}"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      REDIS_URL: "redis://127.0.0.1:{{.REDIS_PORT}}"
    cmds:
      - printf '[network]\ndefault_rootless_network_cmd = "pasta"\n' > {{.CONF_OVERRIDE}}
      - defer: podman rm -f {{.PG_CONTAINER}} {{.MINIO_CONTAINER}} {{.REDIS_CONTAINER}} 2>/dev/null || true
      - podman run -d --name {{.PG_CONTAINER}} -p {{.PG_PORT}}:5432 -e POSTGRES_PASSWORD={{.PG_PASSWORD}} postgres:17-alpine
      - podman run -d --name {{.MINIO_CONTAINER}} -p {{.MINIO_PORT}}:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
      - podman run -d --name {{.REDIS_CONTAINER}} -p {{.REDIS_PORT}}:6379 redis:7-alpine redis-server --save "" --appendonly no
      - until podman exec {{.PG_CONTAINER}} pg_isready -U postgres; do sleep 1; done
      - until curl -sf http://127.0.0.1:{{.MINIO_PORT}}/minio/health/live; do sleep 1; done
      - until podman exec {{.REDIS_CONTAINER}} redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done
      - cargo llvm-cov clean --workspace
      - cargo llvm-cov --no-report --workspace --ignore-filename-regex "{{.COVERAGE_EXCLUDE}}"
      - cargo llvm-cov --no-report -p batlehub-adapters --test pg_cache
      - cargo llvm-cov --no-report -p batlehub-adapters --test pg_vulnerability
      - cargo llvm-cov --no-report -p batlehub-adapters --test local_registry
      - cargo llvm-cov --no-report -p batlehub-adapters --test artifact_meta
      - cargo llvm-cov --no-report -p batlehub-adapters --test pg_rate_limit
      - cargo llvm-cov --no-report -p batlehub-adapters --test storage_router
      - cargo llvm-cov --no-report -p batlehub-adapters --features storage-s3 --test s3_storage
      - cargo llvm-cov --no-report -p batlehub-adapters --test actions_oidc
      - cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_cache
      - cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_rate_limit
      - cargo llvm-cov --no-report -p batlehub-adapters --features cache-redis --test redis_warm_coordinator
      - cargo llvm-cov report --fail-under-lines 80 --ignore-filename-regex "{{.COVERAGE_EXCLUDE}}"

  fuzz:
    desc: "Run a fuzz target for up to MAX_TIME seconds (default: 30). Set TARGET to pick one: fuzz_rbac_evaluate | fuzz_package_id_cache_key | fuzz_deny_latest | fuzz_release_age"
    dir: fuzz
    vars:
      TARGET: '{{.TARGET | default "fuzz_deny_latest"}}'
      MAX_TIME: '{{.MAX_TIME | default "30"}}'
    cmds:
      - cargo +nightly fuzz run {{.TARGET}} -- -max_total_time={{.MAX_TIME}}

  lint:
    desc: Run clippy lints across the workspace
    cmds:
      - cargo clippy --workspace -- -D warnings
      - cargo fmt --all --check

  audit:
    desc: Check Rust dependencies for security vulnerabilities (non-actionable advisories suppressed via .cargo/audit.toml)
    cmds:
      - cargo audit

  deny:
    desc: "Supply-chain gate — advisories, banned crates (rsa/legacy-rustls), licenses and sources (see deny.toml)"
    cmds:
      - cargo deny check

  ui:audit:
    desc: Check frontend pnpm dependencies for security vulnerabilities
    dir: ui
    cmds:
      # Covers the whole dependency tree (direct + transitive) and resolves from
      # pnpm-lock.yaml, so it needs no install. Exits non-zero on high/critical.
      - pnpm audit --audit-level high

  docs:audit:
    desc: Check the documentation site pnpm dependencies for security vulnerabilities
    dir: docs
    cmds:
      # --prod: vitepress (and its transitive vite/esbuild) are build-only
      # tooling for the static site, never shipped or run as a service. Their
      # current advisories (esbuild dev-server CORS/Deno RCE, vite optimized-deps
      # path traversal) have no fix available upstream for vitepress 1.x and
      # don't apply to this repo's build. Runtime deps (e.g. hash-wasm, bundled
      # into the published site) are still audited.
      - pnpm audit --prod --audit-level high

  postmortem:rust:
    desc: "Dependency supply-chain gate for the Rust workspace — source-repo reputation + known vulns, from Cargo.lock"
    cmds:
      # Rebuilds the dependency forest from the lockfile (no install, no
      # lifecycle scripts), resolves each dep to its source repo and scores it
      # (stars, age, last activity, archived, typosquat), then cross-checks
      # vuln.mlab.sh. --fail-on-vuln high is the same bar as `pnpm audit
      # --audit-level high` and the Trivy image gate; the reputation thresholds
      # (--max-risk/--max-dep/--max-high/--max-sus) are deliberately unset until
      # a baseline exists. Keep in sync with .github/workflows/postmortem.yaml.
      #
      # `postmortem` detects only the lockfiles sitting directly in the scanned
      # directory — hence one task per dependency root. Export GITHUB_TOKEN to
      # raise the 60/h anonymous limit on the reputation lookups.
      - postmortem tree . --online --vulns --fail-on-vuln high

  postmortem:ui:
    desc: "Dependency supply-chain gate for the frontend — source-repo reputation + known vulns, from ui/pnpm-lock.yaml"
    dir: ui
    cmds:
      - postmortem tree . --online --vulns --fail-on-vuln high

  postmortem:docs:
    desc: "Dependency supply-chain report for the documentation site (report-only, like `task docs:audit`'s --prod carve-out)"
    dir: docs
    cmds:
      # No --fail-on-vuln, for the same reason docs:audit runs with --prod:
      # vitepress and its transitive build tooling carry advisories with no
      # upstream fix for 1.x, and none of it ships or runs as a service.
      # postmortem has no prod-only filter, so report-only is the equivalent.
      - postmortem tree . --online --vulns

  postmortem:
    desc: "Run the dependency supply-chain gate over every dependency root (Rust, UI, Website)"
    cmds:
      - task: postmortem:rust
      - task: postmortem:ui
      - task: postmortem:docs

  sbom:rust:
    desc: "Generate a CycloneDX SBOM of the shipped server (sbom-rust.cdx.json) — feed to `trivy sbom` / `grype sbom:` to match future CVEs against a shipped build"
    cmds:
      # cargo-cyclonedx writes one <crate>.cdx.json per workspace member next to
      # its manifest; keep only the server's, as the stable repo-root artifact.
      - cargo cyclonedx --format json --manifest-path server/Cargo.toml
      - cp server/batlehub-server.cdx.json sbom-rust.cdx.json
      - find . -maxdepth 3 -name '*.cdx.json' -not -path './sbom-rust.cdx.json' -delete

  security:
    desc: "Run the full local security gate — Rust advisories + bans, frontend audits, dependency supply chain, and Rust SBOM. Trivy/gitleaks/semgrep run in CI (see .github/workflows)"
    cmds:
      - task: audit
      - task: deny
      - task: ui:audit
      - task: docs:audit
      # Needs network (reputation + vuln lookups); the advisory-only audits above
      # can't see an upstream that went archived or got taken over.
      - task: postmortem
      - task: sbom:rust
      - echo "Local gate passed. Image scanning (Trivy) and secret/SAST (gitleaks, semgrep) run in CI."

  fmt:
    desc: Format all Rust source files
    cmds:
      - cargo fmt --all

  release:prepare:
    desc: "Prepare a release — bumps versions, cuts the changelog, commits and tags locally (does not push). Pass args after --, e.g. task release:prepare -- 0.2.0 or task release:prepare -- --minor --dry-run"
    cmds:
      - bash scripts/prepare-release.sh {{.CLI_ARGS}}

  run:
    desc: Start the server with the example config (requires postgres)
    cmds:
      - cargo run -p batlehub-server -- --config config.example.toml

  run:space:
    desc: Start the server with the example config (requires postgres)
    env:
      OIDC_CLIENT_SECRET: "proxy-auth-secret"
    cmds:
      - cargo run -p batlehub-server -- --config config.example-space.toml

  run:s3:
    desc: Start the server with the S3 config (requires compose:s3:db; set AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY first)
    env:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
    cmds:
      - cargo run -p batlehub-server --features storage-s3 -- --config config.example-s3.toml

  generate:
    desc: Regenerate the back client
    cmds:
      - task dump-spec
      - task ui:generate

  cli:
    desc: "Run batlehub-cli with any arguments (e.g. task cli -- registry list)"
    cmds:
      - cargo run -p batlehub-cli -- {{.CLI_ARGS}}

  cli:tui:
    desc: Launch the batlehub-cli interactive TUI
    cmds:
      - cargo run -p batlehub-cli -- tui

  cli:help:
    desc: Print batlehub-cli help
    cmds:
      - cargo run -p batlehub-cli -- --help

  dump-spec:
    desc: Dump the OpenAPI spec to ui/openapi.json
    cmds:
      - cargo run -p batlehub-server -- --config config.example.toml dump-spec > ui/openapi.json

  # ── Frontend ──────────────────────────────────────────────────────────────────

  ui:install:
    desc: Install frontend dependencies (pnpm)
    dir: ui
    cmds:
      - pnpm install

  ui:generate:
    desc: Generate TypeScript client from the OpenAPI spec (run dump-spec first)
    dir: ui
    cmds:
      - pnpm run generate

  ui:tokens:
    desc: Copy the design tokens to the docs site (single source is ui/src/design/tokens.css)
    cmds:
      - cp ui/src/design/tokens.css docs/.vitepress/theme/tokens.css

  ui:tokens:check:
    desc: Fail if the docs site's token copy has drifted from ui/src/design/tokens.css
    cmds:
      - task: ui:tokens
      - |
        if ! git diff --quiet -- docs/.vitepress/theme/tokens.css; then
          echo "the docs site's token copy is stale — run 'task ui:tokens' and commit the result" >&2
          git --no-pager diff -- docs/.vitepress/theme/tokens.css >&2
          exit 1
        fi

  ui:dev:
    desc: Start the Vite dev server (proxies /api and /proxy to localhost:8080)
    dir: ui
    cmds:
      - pnpm run dev

  ui:build:
    desc: Build the frontend SPA for production
    dir: ui
    cmds:
      - pnpm run build

  ui:lint:
    desc: Run the frontend oxlint, eslint and oxfmt checks locally
    dir: ui
    cmds:
      - pnpm run lint
      - pnpm run lint:eslint
      - pnpm run format:check

  ui:i18n:
    desc: Report user-visible text still hardcoded in templates
    dir: ui
    cmds:
      - pnpm run i18n:audit

  ui:i18n:check:
    desc: Fail if the untranslated-string count rises above the current budget
    dir: ui
    cmds:
      - pnpm run i18n:check

  # ── Browser sidecar (che-browser) ────────────────────────────────────────────
  # Headed Chrome in a sidecar of this pod. CDP (9222), chromedriver (9515) and
  # noVNC (6080) are plain localhost ports because the pod shares one network
  # namespace; only what lives *inside* the sidecar needs the kubectl exec hop,
  # which is what BROWSER_EXEC is. Both env vars it reads are exported into every
  # Che workspace container: $HOSTNAME is the pod name, $DEVWORKSPACE_NAMESPACE
  # the namespace (the `:+` guard keeps this working outside a workspace too).
  browser:check:
    desc: Verify the browser sidecar is up, and print its CDP version
    cmds:
      - curl -sf http://localhost:9222/json/version

  browser:tabs:
    desc: List the browser's open tabs (id, type, title, url)
    cmds:
      - |
        curl -s http://localhost:9222/json | python3 -c '
        import json, sys
        for t in json.load(sys.stdin):
            print("%-34s %-10s %-40s %s" % (t["id"], t["type"], t["title"][:40], t["url"]))
        '

  browser:open:
    desc: 'Open a URL in a new tab (task browser:open URL=http://localhost:5173)'
    requires:
      vars: [URL]
    cmds:
      - curl -s -X PUT "http://localhost:9222/json/new?{{.URL}}"

  browser:close:
    desc: 'Close a tab by id (task browser:close ID=<id from browser:tabs>)'
    requires:
      vars: [ID]
    cmds:
      - curl -sf "http://localhost:9222/json/close/{{.ID}}"

  browser:vnc:
    desc: Print the noVNC password (open the `novnc` endpoint to watch Chrome)
    cmds:
      # Written by the sidecar entrypoint at boot onto the shared /projects
      # mount; the log is the fallback if that mount ever goes away.
      - |
        cat /projects/.sidecar/vnc-password-browser.txt 2>/dev/null \
          || {{.BROWSER_LOGS}} | grep -m1 'noVNC password:'
      - "echo '→ open the novnc endpoint of this workspace and log in with it'"

  # Chrome is gated behind a flag file the entrypoint's respawn loop watches, so
  # it can be parked (freeing ~1 GiB) without taking the VNC stack down with it.
  # `sidecar-app stop` group-kills the whole Chrome process tree — a bare pkill
  # on the child processes leaves the parent to be respawned in a half state.
  browser:status:
    desc: Report whether Chrome is running, parked or starting
    cmds:
      - '{{.BROWSER_EXEC}} sidecar-app status'

  browser:start:
    desc: Launch Chrome in the sidecar and wait for CDP to answer
    cmds:
      - '{{.BROWSER_EXEC}} sidecar-app start'
      - |
        for _ in $(seq 1 30); do
          curl -sf http://localhost:9222/json/version >/dev/null && exit 0
          sleep 1
        done
        echo "CDP did not come up within 30s — check 'task browser:logs'" >&2
        exit 1

  browser:stop:
    desc: Park Chrome (frees its memory; noVNC and chromedriver stay up)
    cmds:
      - '{{.BROWSER_EXEC}} sidecar-app stop'

  browser:restart:
    desc: Park Chrome and relaunch it with a clean window
    cmds:
      - task: browser:stop
      - task: browser:start

  browser:exec:
    desc: 'Run a command inside the sidecar (task browser:exec CMD="ps -ef")'
    requires:
      vars: [CMD]
    cmds:
      - '{{.BROWSER_EXEC}} sh -c {{.CMD | quote}}'

  browser:shell:
    desc: Open an interactive shell in the browser sidecar
    interactive: true
    cmds:
      - kubectl exec -it ${DEVWORKSPACE_NAMESPACE:+-n ${DEVWORKSPACE_NAMESPACE}} ${HOSTNAME} -c browser -- bash

  browser:logs:
    desc: Follow the browser sidecar log
    cmds:
      - '{{.BROWSER_LOGS}} -f'

  # Chromium cannot run in the tools container (no libglib-2.0, and no root to
  # install it), so these run *inside* the browser sidecar. That works because
  # the pod shares one network namespace — the sidecar reaches the dev server on
  # plain localhost — and shares /home and /projects, so it runs the same
  # mise-installed node and the same npx cache as every other task here.
  #
  # Two env details are load-bearing. PUPPETEER_EXECUTABLE_PATH reuses the
  # sidecar's Chrome instead of letting puppeteer download a second copy into
  # the shared cache. CI=1 is what makes impeccable pass --no-sandbox, which
  # Chrome needs here for exactly the reason it does on a GitHub runner:
  # unprivileged user namespaces are unavailable, and without it Chrome aborts
  # with "No usable sandbox!".
  ui:design:rendered:
    desc: Run the rendered design gates against a running dev server (needs the browser sidecar)
    deps: [browser:check]
    vars:
      # mise pins the node version, so resolve the bin dir rather than hardcode
      # it. PATH is then set to a literal (no $PATH) so nothing expands in the
      # outer shell before kubectl hands the string to the sidecar.
      NODE_BIN:
        sh: dirname "$(readlink -f "$(command -v node)")"
      # 5174, not 5173: the gates run inside the pod, and that is the front
      # wired to the API on localhost (`task ui:dev:local`).
      BASE: '{{.BASE | default "http://localhost:5174"}}'
      # Every route reachable without a session. `/me/*` and `/admin/*` sit
      # behind requiresAuth/requiresAdmin and would redirect to /login, so
      # scanning them would measure the login page 14 times over — see the
      # note in RFC 0003 §13 about what this gate still cannot see.
      ROUTES: '{{.ROUTES | default "/ /login /packages /setup /tools/access-check /tools/url-mapper"}}'
      # cd into the repo so the detector loads DESIGN.md and .impeccable/ — a
      # design-system-aware scan is the whole point of R6.
      ENV: 'export PATH={{.NODE_BIN}}:/usr/local/bin:/usr/bin:/bin PUPPETEER_EXECUTABLE_PATH=/opt/chrome/chrome CI=1; cd {{.ROOT_DIR}};'
      # One invocation per route, deliberately. Passing every URL to a single
      # `detect` run reuses one browser session with a ~100ms settle, and an SPA
      # that hydrates asynchronously then gets measured mid-hydration: three
      # identical batched runs returned 1, 2 and 1 findings. Per-route is slower
      # and repeatable, and a gate that fails at random is a gate people retry
      # until it passes.
      SCAN: 'for r in {{.ROUTES}}; do echo "→ $r"; npx --yes impeccable detect --viewport "$V" "{{.BASE}}$r" || fail=1; done; [ -z "$fail" ]'
    cmds:
      # The same two viewports CI uses: contrast and hierarchy are width-blind,
      # overflow and reflow are not.
      - '{{.BROWSER_EXEC}} sh -c {{printf "%s V=1440x900; %s" .ENV .SCAN | squote}}'
      - '{{.BROWSER_EXEC}} sh -c {{printf "%s V=390x844; %s" .ENV .SCAN | squote}}'
      # axe and the ramp check now come from `ui:design:routes`, which measures
      # these same routes *and* the authenticated ones with one set of
      # assertions. `@axe-core/cli` used to batch the public routes here; it
      # does not know what a type ramp is, which is precisely how `/packages`
      # drifted from its own design proof behind a green gate (RFC 0004-bis
      # §4.4). Anonymous-only, so this stays runnable without credentials.
      - task: ui:design:routes
        vars: { PUBLIC_ONLY: "--public-only", BASE: "{{.BASE}}" }

  # One gate, every rendered route, both viewports — axe plus the type ramp and
  # the display face (RFC 0004-bis §4.4).
  #
  # The 15 admin pages and the 4 account pages sit behind router guards, and
  # both `impeccable detect` and `@axe-core/cli` scan by URL with no way to
  # carry a session, so scanning them graded the login page over and over. This
  # seeds a token instead. The public routes are in the same list because a
  # separate gate for them measured contrast and hierarchy and never the ramp.
  #
  # Tokens come from the environment and are never written to a file — they are
  # credentials for a running instance. Pass them per invocation:
  #
  #   BATLEHUB_ADMIN_TOKEN=… BATLEHUB_USER_TOKEN=… task ui:design:routes
  #
  # `/packages` is pinned as an expected failure; see EXPECTED_FAIL in the
  # script and RFC 0004-bis O3.
  ui:design:routes:
    desc: axe + type ramp over every rendered route (needs BATLEHUB_{ADMIN,USER}_TOKEN)
    deps: [browser:check]
    dir: ui
    vars:
      NODE_BIN:
        sh: dirname "$(readlink -f "$(command -v node)")"
      BASE: '{{.BASE | default "http://localhost:5174"}}'
      PUBLIC_ONLY: '{{.PUBLIC_ONLY | default ""}}'
    cmds:
      - |
        if [ -z "{{.PUBLIC_ONLY}}" ] && { [ -z "$BATLEHUB_ADMIN_TOKEN" ] || [ -z "$BATLEHUB_USER_TOKEN" ]; }; then
          echo "set BATLEHUB_ADMIN_TOKEN and BATLEHUB_USER_TOKEN (or pass PUBLIC_ONLY=--public-only)" >&2
          exit 2
        fi
        {{.BROWSER_EXEC}} sh -c "export PATH={{.NODE_BIN}}:/usr/bin:/bin BASE={{.BASE}} \
          BATLEHUB_ADMIN_TOKEN=$BATLEHUB_ADMIN_TOKEN BATLEHUB_USER_TOKEN=$BATLEHUB_USER_TOKEN; \
          cd {{.ROOT_DIR}}/ui && node build/design-routes.mjs {{.PUBLIC_ONLY}}"

  # Kept as an alias: RFC 0004 and the contributing docs name this target, and
  # it is now one plan of `ui:design:routes` rather than its own script.
  ui:design:rendered:authed:
    desc: Alias for ui:design:routes (RFC 0004-bis §4.4 merged the two gates)
    cmds:
      - task: ui:design:routes

  ui:design:
    desc: Run the console's static design gates locally (detector, i18n)
    cmds:
      # The docs site's half of this scan moved to `docs:design`, together with
      # the token-drift check it belongs with (RFC 0005 phase 4).
      - npx --yes impeccable detect ui/src
      - task: ui:i18n:check

  ui:i18n:review:
    desc: Regenerate the French review sheet from the catalogues
    cmds:
      - python3 scripts/i18n-review.py

  # ── Dev servers ──────────────────────────────────────────────────────────────
  # Two fronts, because the browser deciding what "localhost" means is not the
  # same browser in the two cases:
  #
  #   5173  reached through the workspace's public `front` endpoint, from a real
  #         browser on your machine. There, `localhost:8080` is *your* laptop, so
  #         the API has to be named by its public FQDN — which is per-user and
  #         per-workspace, hence generated by `url` rather than committed.
  #   5174  reached from inside the pod (the browser sidecar, the rendered design
  #         gates). The pod shares one network namespace, so plain localhost is
  #         both correct and faster — no ingress, no TLS, no CORS preflight to a
  #         public name.
  #
  # They differ only by which env file Vite loads: a `--mode` file outranks
  # `.env`, so one working tree serves both without either clobbering the other.
  # Both tasks state VITE_API_BASE_URL explicitly, and must. This Taskfile sets
  # `dotenv: [ .env ]`, so the repo-root `.env` is injected into every task's
  # environment — and Vite gives `process.env` priority over its own `.env`
  # files. An inherited value therefore beats `ui/.env.localhost`, which is
  # exactly how both fronts silently ended up on the same API. Naming it here is
  # what makes each front's target a property of the task rather than of
  # whatever happens to be in the root `.env`.
  ui:dev:
    desc: Front on 5173 → API via the workspace FQDN (open the `front` endpoint)
    dir: ui
    env:
      # `url back` prints a trailing slash; the generated SDK appends
      # "/api/v1/…", so leaving it produces a double slash in every request.
      VITE_API_BASE_URL:
        sh: url back | sed 's#/$##'
    cmds:
      - 'echo "API → $VITE_API_BASE_URL"'
      - pnpm run dev:fqdn

  ui:dev:local:
    desc: 'Front on 5174 → API on localhost:8080 (in-pod: sidecar, rendered gates)'
    dir: ui
    env:
      VITE_API_BASE_URL: http://localhost:8080
    cmds:
      - 'echo "API → $VITE_API_BASE_URL"'
      - pnpm run dev:local

  ui:test:
    desc: Run the frontend test suite
    dir: ui
    cmds:
      - pnpm run test

  ui:coverage:
    desc: Run the frontend test suite with coverage (enforces threshold)
    dir: ui
    cmds:
      - pnpm run coverage

  ui:fix:
    desc: Auto-fix oxlint issues and format the frontend source with oxfmt
    dir: ui
    cmds:
      - pnpm run lint:fix
      - pnpm run format

  # ── Design (Impeccable — RFC 0003) ───────────────────────────────────────────
  # The skill is ~150 vendored files, so it is gitignored and installed on demand
  # rather than reviewed as a diff. PRODUCT.md and DESIGN.md hold the decisions
  # and are tracked. Reload the AI harness after installing or updating.
  impeccable:install:
    desc: Install the Impeccable design skill into .claude/ (project scope)
    cmds:
      - npx --yes impeccable install --providers=claude --scope=project

  impeccable:update:
    desc: Refresh an existing Impeccable install to the latest release
    cmds:
      - npx --yes impeccable update

  impeccable:detect:
    desc: Scan the UI and docs site for design anti-patterns (no LLM, no API key)
    cmds:
      - npx --yes impeccable detect ui/src docs/.vitepress

  dev:
    desc: Start Rust backend and Vite frontend in parallel (requires postgres)
    deps:
      - task: run
      - task: ui:dev

  dev:s3:
    desc: Start Rust backend (S3 config) and Vite frontend in parallel (requires compose:s3:db)
    deps:
      - task: run:s3
      - task: ui:dev

  # ── Podman Compose ────────────────────────────────────────────────────────────

  compose:up:
    desc: Start postgres + server via Podman Compose
    cmds:
      - podman compose up -d

  compose:auth:
    desc: Start the optional Authentik OIDC provider (requires compose:up)
    cmds:
      - podman compose --profile authentik up -d authentik-postgres
      - podman compose --profile authentik up -d authentik-redis
      - podman compose --profile authentik up -d authentik-server
      - podman compose --profile authentik up -d authentik-worker

  compose:auth:pwd:
    desc: "Set admin password for the Authentik identity provider (default: akadmin)"
    cmds:
      - podman compose exec -T authentik-server ak shell -c "from authentik.core.models import User; u=User.objects.get(username='akadmin'); u.set_password('akadmin'); u.save(); print('password reset for', u.username)"

  compose:down:
    desc: Stop and remove compose containers
    cmds:
      - podman compose down

  compose:logs:
    desc: Tail server logs
    cmds:
      - podman compose logs -f server

  compose:db:
    desc: Start only postgres (for local cargo run)
    cmds:
      - podman compose up -d postgres

  compose:build:
    desc: (Re)build the server image
    cmds:
      - podman compose build

  compose:otel:
    desc: Start all services including Jaeger
    cmds:
      - podman compose --profile otel up -d

  # ── S3 / RustFS ───────────────────────────────────────────────────────────────

  compose:s3:up:
    desc: Start the full S3 stack (postgres + RustFS + Authentik + Jaeger + server) via docker-compose.s3.yml
    cmds:
      - podman compose -f docker-compose.s3.yml up postgres -d
      - podman compose -f docker-compose.s3.yml up authentik-postgres -d
      - podman compose -f docker-compose.s3.yml up rustfs -d
      - podman compose -f docker-compose.s3.yml up authentik-redis -d
      - podman compose -f docker-compose.s3.yml up authentik-server -d
      - podman compose -f docker-compose.s3.yml up authentik-worker -d
      - podman compose -f docker-compose.s3.yml up jaeger -d

  compose:s3:db:
    desc: Start infrastructure only (postgres, RustFS, Authentik, Jaeger) for local cargo run
    cmds:
      - podman compose -f docker-compose.s3.yml up -d postgres rustfs rustfs-init authentik-postgres authentik-redis authentik-server authentik-worker jaeger

  compose:s3:down:
    desc: Stop and remove the S3 stack containers
    cmds:
      - podman compose -f docker-compose.s3.yml down {{ .CLI_ARGS }}

  compose:s3:logs:
    desc: Tail server logs from the S3 stack
    cmds:
      - podman compose -f docker-compose.s3.yml logs -f server

  compose:s3:build:
    desc: (Re)build the server image for the S3 stack
    cmds:
      - podman compose -f docker-compose.s3.yml build

  compose:s3:auth:pwd:
    desc: "Set admin password for the Authentik identity provider (default: akadmin)"
    cmds:
      - podman compose exec -T authentik-server ak shell -c "from authentik.core.models import User; u=User.objects.get(username='akadmin'); u.set_password('akadmin'); u.save(); print('password reset for', u.username)"
  compose:s3:bucket:create:
    desc: Create the "artifacts" bucket in RustFS (requires compose:s3:db)
    cmds:
      - until curl -sf http://localhost:9900/health; do sleep 1; done
      - mc alias set local http://localhost:9900 rustfsadmin rustfsadmin
      - mc mb --ignore-existing local/artifacts

  # ── The documentation site (VitePress) ──────────────────────────────────────────────────

  docs:dev:
    desc: Start the VitePress documentation dev server
    dir: docs
    cmds:
      - pnpm run docs:dev

  docs:build:
    desc: Build the VitePress documentation site for production
    dir: docs
    cmds:
      - pnpm run docs:build

  docs:preview:
    desc: Preview the built VitePress documentation site
    dir: docs
    cmds:
      - pnpm run docs:preview

  # ── The published roadmap (RFC 0005 Q5) ──────────────────────────────────────
  # ROADMAP.md and docs/guide/roadmap.md were two hand-edited documents that
  # had drifted by 393 lines, with nothing watching. The roadmap is a project
  # artifact that happens to be worth publishing, so the root file is canonical
  # and the page is generated from it — the same arrangement, and the same pair
  # of tasks, as the design tokens.

  docs:roadmap:
    desc: Regenerate the published roadmap page from the canonical ROADMAP.md
    cmds:
      - |
        {
          # `reference: true` is the declaration `docs:structure` asks for above
          # 4 000 words. The roadmap is 4 826 and it is a list a reader scans,
          # not prose they read — the point of the rule is that the exception is
          # written down rather than silent.
          printf '%s\n' '---' 'reference: true' '---' ''
          echo '<!-- Generated from ROADMAP.md by `task docs:roadmap`. Do not edit this file. -->'
          echo
          cat ROADMAP.md
        } > docs/guide/roadmap.md

  docs:roadmap:check:
    desc: Fail if the published roadmap page has drifted from ROADMAP.md
    # Compares content rather than git state, for the reason above: the whole
    # page is generated here, but `git diff` still conflates "the generator
    # would produce something different" with "this file has any uncommitted
    # change at all" (RFC 0009 §13.21).
    cmds:
      - |
        set -euo pipefail
        before=$(cat docs/guide/roadmap.md 2>/dev/null || true)
        task docs:roadmap >/dev/null
        if [ "$before" != "$(cat docs/guide/roadmap.md)" ]; then
          echo "published roadmap is stale — run 'task docs:roadmap' and commit the result" >&2
          exit 1
        fi
        echo "the published roadmap matches ROADMAP.md"

  # ── Listing-filter coverage (RFC 0006 §4.3, §7) ──────────────────────────────
  # Which registries hide blocked versions from their listings used to be a
  # warning box in the admin guide naming npm as the only one — a fact about the
  # code that nothing kept true, and exactly the "documented but not closed"
  # gap the RFC exists to remove. The table is now generated from
  # `RegistryKind::listing_filter()`, an exhaustive match a new registry kind
  # cannot be added without answering.
  #
  # Only the block between the two markers is replaced, so the surrounding prose
  # stays hand-written.

  docs:listing-coverage:
    desc: Regenerate the listing-filter coverage table in the admin guide
    cmds:
      - |
        set -euo pipefail
        page=docs/guide/admin-policies.md
        table=$(cargo run -q -p batlehub-server --bin listing_coverage)
        awk -v table="$table" '
          /^<!-- BEGIN listing-coverage/ { print; print table; skip = 1; next }
          /^<!-- END listing-coverage/   { skip = 0 }
          !skip                          { print }
        ' "$page" > "$page.tmp"
        mv "$page.tmp" "$page"

  docs:listing-coverage:check:
    desc: Fail if the admin guide's coverage table has drifted from the code
    # Diffs only the region between the markers, not the whole page. A
    # whole-file `git diff` fails on any uncommitted change — including
    # hand-written prose this generator never touches — and then prints
    # "run the task and commit the result", which fixes nothing because the
    # generated block was already correct (RFC 0009 §13.21).
    cmds:
      - |
        set -euo pipefail
        page=docs/guide/admin-policies.md
        block() {
          awk '/^<!-- BEGIN listing-coverage/{f=1} f{print} /^<!-- END listing-coverage/{f=0}' "$1"
        }
        before=$(block "$page")
        task docs:listing-coverage >/dev/null
        if [ "$before" != "$(block "$page")" ]; then
          echo "the listing-coverage table is stale — run 'task docs:listing-coverage' and commit the result" >&2
          diff <(printf '%s\n' "$before") <(block "$page") >&2 || true
          exit 1
        fi
        echo "the listing-coverage table matches the code"

  # ── Per-registry endpoint reference (RFC 0009 §6) ────────────────────────────
  # These tables were hand-maintained and drifted the way a hand-maintained
  # inventory always does: rubygems listed six routes where ten exist, terraform
  # documented a protocol the code does not implement, npm published an audit
  # path npm never sends. Generated from the spec `task dump-spec` already
  # produces, so the inventory cannot disagree with the routes. Only the block
  # between the markers is replaced; the prose around it stays hand-written.

  docs:endpoints:
    desc: Regenerate the per-registry endpoint tables from ui/openapi.json
    dir: docs
    cmds:
      - node build/gen-endpoints.mjs

  docs:endpoints:check:
    desc: Fail if a registry page's endpoint table has drifted from the API surface
    dir: docs
    cmds:
      - node build/gen-endpoints.mjs --check

  # ── The docs site's design gates (RFC 0005 phase 4) ──────────────────────────
  # Until these existed the public site's entire design coverage was one static
  # source scan, while the internal console had axe plus a type-ramp check over
  # 30 rendered route/role pairs at two viewports. The surface every prospective
  # user sees was the one nobody measured in a browser.

  docs:design:
    desc: Static design gates for the docs site (detector + token drift)
    cmds:
      - npx --yes impeccable detect docs/.vitepress
      # Now load-bearing. Before the token copy was imported by anything, this
      # check guarded the freshness of a file no stylesheet read.
      - task: ui:tokens:check
      - task: docs:roadmap:check
      - task: docs:listing-coverage:check
      - task: docs:endpoints:check
      - task: docs:links
      - task: docs:structure
      - task: docs:audience

  docs:links:
    desc: Every documentation cross-reference resolves, and no published page is orphaned
    dir: docs
    cmds:
      # Wider than VitePress's own dead-link check on purpose — it covers
      # `internal/` and the repository's own markdown, treats a code span
      # naming a `.md` path as the link it is, and knows what an orphan is.
      # See the header of the script.
      - node build/check-links.mjs

  docs:structure:
    desc: Heading depth, section numbering and declared page length (RFC 0005-bis §4.5)
    dir: docs
    cmds:
      # Every other gate here reads rendering. This one reads shape, which is
      # how a subsection numbered 6.16 sat inside section 11 of the biggest page
      # in the documentation through every green build there has ever been.
      - node build/check-structure.mjs

  docs:audience:
    desc: One sidebar per page, no "see also" loops, and the counts (RFC 0005-bis §4.4)
    dir: docs
    cmds:
      # The other half of the orphan check in `docs:links`: a page listed twice
      # is as much a defect as a page listed never, and both are computable from
      # the tree and the sidebars.
      - node build/check-audience.mjs

  docs:corpus:
    desc: Words, minutes, headings and depth per published page — a report, not a gate
    dir: docs
    cmds:
      - node build/check-structure.mjs --report

  docs:design:rendered:
    desc: axe + type ramp + material over every built page, 2 viewports, both renditions
    deps: [browser:check]
    dir: docs
    vars:
      # DOCS_PORT, not PORT: Taskfile resolves variables from the environment
      # too, and `dotenv: [ .env ]` puts the repo's `PORT` there — the first run
      # of this guard aborted on port 5437 because a bare `PORT` had silently
      # won over the default.
      DOCS_PORT: '{{.DOCS_PORT | default "4173"}}'
    cmds:
      # Builds, serves the build, measures it, and takes the server down again —
      # the gate has to run against the artifact that ships, not against a dev
      # server with different asset handling.
      #
      # `vitepress preview` maps the output directory once at startup, so a
      # server left running from an earlier build serves the earlier build. That
      # is not a hypothetical: it is how three of this gate's own findings first
      # read as fixed when they were not.
      - |
        set -e
        # Refuse to run against someone else's server. `vitepress preview` fails
        # to bind a taken port and exits, and the gate then measures whatever is
        # already listening — which is how a run reported five findings against
        # a build three edits old, and reported them twice. A gate that measures
        # the wrong artifact is worse than no gate.
        if curl -sf "http://localhost:{{.DOCS_PORT}}/" -o /dev/null; then
          echo "port {{.DOCS_PORT}} is already serving something — stop it first, or pass PORT=…" >&2
          exit 2
        fi
        pnpm run docs:build
        pnpm exec vitepress preview --port {{.DOCS_PORT}} >/tmp/docs-preview.log 2>&1 &
        preview=$!
        # `$preview` is pnpm's pid, and pnpm is not what holds the port —
        # vitepress is, as its child. Killing the parent alone left a server
        # listening after every run, so the *next* run tripped the guard above
        # and refused to measure. Kill the child by what it is.
        trap 'kill $preview 2>/dev/null || true; pkill -f "vitepress preview --port {{.DOCS_PORT}}" 2>/dev/null || true' EXIT
        for _ in $(seq 1 100); do
          curl -sf "http://localhost:{{.DOCS_PORT}}/" -o /dev/null && break
          sleep 0.2
        done
        BASE="http://localhost:{{.DOCS_PORT}}" node build/design-routes.mjs

  docs:design:survey:
    desc: Same measurements as docs:design:rendered, reported and never failing
    deps: [browser:check]
    dir: docs
    vars:
      # DOCS_PORT, not PORT: Taskfile resolves variables from the environment
      # too, and `dotenv: [ .env ]` puts the repo's `PORT` there — the first run
      # of this guard aborted on port 5437 because a bare `PORT` had silently
      # won over the default.
      DOCS_PORT: '{{.DOCS_PORT | default "4173"}}'
    cmds:
      - |
        set -e
        # Refuse to run against someone else's server. `vitepress preview` fails
        # to bind a taken port and exits, and the gate then measures whatever is
        # already listening — which is how a run reported five findings against
        # a build three edits old, and reported them twice. A gate that measures
        # the wrong artifact is worse than no gate.
        if curl -sf "http://localhost:{{.DOCS_PORT}}/" -o /dev/null; then
          echo "port {{.DOCS_PORT}} is already serving something — stop it first, or pass PORT=…" >&2
          exit 2
        fi
        pnpm run docs:build
        pnpm exec vitepress preview --port {{.DOCS_PORT}} >/tmp/docs-preview.log 2>&1 &
        preview=$!
        # `$preview` is pnpm's pid, and pnpm is not what holds the port —
        # vitepress is, as its child. Killing the parent alone left a server
        # listening after every run, so the *next* run tripped the guard above
        # and refused to measure. Kill the child by what it is.
        trap 'kill $preview 2>/dev/null || true; pkill -f "vitepress preview --port {{.DOCS_PORT}}" 2>/dev/null || true' EXIT
        for _ in $(seq 1 100); do
          curl -sf "http://localhost:{{.DOCS_PORT}}/" -o /dev/null && break
          sleep 0.2
        done
        BASE="http://localhost:{{.DOCS_PORT}}" node build/design-routes.mjs --survey

  # ── Performance testing ───────────────────────────────────────────────────────

  perf:infra:up:
    desc: Start Prometheus + Grafana monitoring stack (http://localhost:3000, admin/admin)
    cmds:
      - podman compose -f perf/docker-compose.monitoring.yml up -d

  perf:infra:down:
    desc: Stop Prometheus + Grafana monitoring stack
    cmds:
      - podman compose -f perf/docker-compose.monitoring.yml down

  perf:upstream:
    desc: "Start mock upstream registry on :9999 (simulate npm/cargo upstreams)"
    dir: perf/mock-upstream
    cmds:
      - cargo run --release -- --port 9999 --delay-ms {{.DELAY_MS | default "0"}} --artifact-size-kb {{.ARTIFACT_KB | default "512"}}

  perf:server:
    desc: Run BatleHub with the perf config (requires compose:db and perf:upstream)
    env:
      BATLEHUB_CONFIG: perf/config.perf.toml
    cmds:
      - cargo run -p batlehub-server --release

  perf:seed:
    desc: Warm the artifact cache with seed data (requires perf:server and perf:upstream)
    cmds:
      - bash perf/scripts/seed.sh {{.BASE_URL | default "http://localhost:8080"}}

  perf:run:rest:
    desc: "k6 scenario 01 — at-rest baseline (60 s, 1 VU) + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/01_at_rest.js

  perf:run:read:
    desc: "k6 scenario 02 — warm-cache read load (ramp to 200 VU ≈ 2k req/s) + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/02_warm_read.js

  perf:run:miss:
    desc: "k6 scenario 03 — cache-miss / proxy-through load (20 VU, 120 s) + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/03_cache_miss.js

  perf:run:upload:
    desc: "k6 scenario 04 — artifact upload/publish load (10 VU, 60 s) + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/04_upload.js {{.CLI_ARGS}}

  perf:run:mixed:
    desc: "k6 scenario 05 — realistic mixed workload (80% read / 15% miss / 5% upload, 10 min) + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/05_mixed.js

  perf:run:sbom:
    desc: "k6 scenario 06 — SBOM read + org export load (60 s) + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/06_sbom.js

  perf:run:eviction:
    desc: "k6 scenario 07 — cache eviction sweep under concurrent cache growth (60 s) + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/07_eviction.js

  perf:run:all:
    desc: Run the full perf suite in sequence (scenarios 01-07); threshold violations are reported but do not stop the suite
    cmds:
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/01_at_rest.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/02_warm_read.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/03_cache_miss.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/04_upload.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/05_mixed.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/06_sbom.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/07_eviction.js

  # ── Performance testing — S3 + Redis backends ─────────────────────────────────
  # Same k6 scenarios as the filesystem/memory suite; only the server config
  # differs.  Run both suites back-to-back to compare backends head-to-head.

  perf:s3:infra:up:
    desc: Start MinIO (S3, :9200) + Redis (:6380) and create the perf-artifacts bucket
    cmds:
      - podman compose -f perf/docker-compose.perf-s3.yml up -d perf-minio
      - until curl -sf http://localhost:9200/minio/health/live; do sleep 1; done
      - mc alias set perf-minio http://localhost:9200 minioadmin minioadmin
      - mc mb --ignore-existing perf-minio/perf-artifacts
      - podman compose -f perf/docker-compose.perf-s3.yml up -d perf-redis

  perf:s3:infra:down:
    desc: Stop MinIO and Redis perf containers
    cmds:
      - podman compose -f perf/docker-compose.perf-s3.yml down

  perf:s3:server:
    desc: Run BatleHub with the S3 + Redis perf config (requires compose:db and perf:s3:infra:up)
    env:
      BATLEHUB_CONFIG: perf/config.perf-s3.toml
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    cmds:
      - cargo run -p batlehub-server --release --features storage-s3

  perf:s3:run:rest:
    desc: "k6 scenario 01 — at-rest baseline against S3+Redis server + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/01_at_rest.js

  perf:s3:run:read:
    desc: "k6 scenario 02 — warm-cache read load against S3+Redis server + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/02_warm_read.js

  perf:s3:run:miss:
    desc: "k6 scenario 03 — cache-miss / proxy-through against S3+Redis server + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/03_cache_miss.js

  perf:s3:run:upload:
    desc: "k6 scenario 04 — artifact upload/publish against S3+Redis server + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/04_upload.js {{.CLI_ARGS}}

  perf:s3:run:mixed:
    desc: "k6 scenario 05 — realistic mixed workload against S3+Redis server + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/05_mixed.js

  perf:s3:run:sbom:
    desc: "k6 scenario 06 — SBOM read + org export load against S3+Redis server + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/06_sbom.js

  perf:s3:run:eviction:
    desc: "k6 scenario 07 — cache eviction sweep against S3+Redis server + RAM/CPU summary"
    cmds:
      - bash perf/scripts/run_with_metrics.sh perf/k6/scenarios/07_eviction.js

  perf:s3:run:all:
    desc: Run the full S3+Redis perf suite in sequence; threshold violations are reported but do not stop the suite
    cmds:
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/01_at_rest.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/02_warm_read.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/03_cache_miss.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/04_upload.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/05_mixed.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/06_sbom.js
      - bash perf/scripts/run_with_metrics.sh --no-thresholds perf/k6/scenarios/07_eviction.js
