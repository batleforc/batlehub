# Standalone workspace, like `perf/mock-upstream` beside it: this is measurement
# tooling, not part of the product, and `cargo test --workspace` should not
# compile it.
[workspace]

[package]
name = "corpus-seed"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "corpus-seed"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
futures-util = "0.3"
serde_json = "1"

[profile.release]
opt-level = 2
